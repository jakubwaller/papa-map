<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f5f3" />
  <title>PapaMap Hamburg — Wickeltische, die Väter erreichen</title>
  <meta name="description" content="A map of baby changing tables in Hamburg, colored by whether a dad can actually reach them. Data: OpenStreetMap." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23009e73'/%3E%3Crect x='5' y='12' width='14' height='2.6' rx='1.3' fill='%23fff'/%3E%3Ccircle cx='9' cy='9' r='2.2' fill='%23fff'/%3E%3Crect x='11.5' y='7.8' width='6.5' height='2.4' rx='1.2' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Zoom controls -->
  <div id="zoom-ctrl">
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
  </div>

  <!-- Top overlay: header + stats strip + status filter -->
  <div id="topbar">
    <header>
      <a class="brandmark" href="./" aria-label="PapaMap Hamburg — home">
        <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="12" width="18" height="2.8" rx="1.4" fill="#009e73"></rect>
          <rect x="4.6" y="14.8" width="2.4" height="6" rx="1.2" fill="#00775a"></rect>
          <rect x="17" y="14.8" width="2.4" height="6" rx="1.2" fill="#00775a"></rect>
          <circle cx="8" cy="9.2" r="2.4" fill="#3d4247"></circle>
          <rect x="11" y="7.9" width="8" height="2.6" rx="1.3" fill="#3d4247"></rect>
        </svg>
        <span class="wordmark">
          <span class="name">PapaMap</span>
          <span class="city">Hamburg</span>
        </span>
      </a>
      <span class="tagline">Wickeltische, die Väter erreichen</span>
      <nav class="header-actions">
        <a href="methods.html">Methods</a>
      </nav>
    </header>

    <div id="stats"><!-- stats strip injected by app.js from data/stats.json --></div>

    <div id="filter-bar" class="chip-bar">
      <!-- status chips (legend + count badges + filter toggles) injected by app.js -->
      <span class="spacer"></span>
      <span id="count" class="count"></span>
    </div>
  </div>

  <div id="attribution">© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a></div>

  <script src="vendor/maplibre-gl.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
