services:
  # Static server. The site is plain files, so they are bind-mounted rather
  # than baked in: `git pull` is the deploy, no rebuild.
  papamap:
    image: caddy:2-alpine
    container_name: papamap
    restart: unless-stopped
    # No host port: the only ingress is the host Caddy over web_proxy
    # (reverse_proxy papamap:8012).
    volumes:
      - ./deploy/papamap.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - ./web-data:/srv/data:ro   # generated GeoJSON + stats, read-only here
      # Also generated: one page per Bundesland. Same arrangement as /srv/data —
      # build output lives in web-data/ and is mounted back into the tree at the
      # URL it is served from, because web/ itself is read-only to the pipeline.
      - ./web-data/wickeltische:/srv/wickeltische:ro
      # The private ops page and the auth snippet that gates it. Both host
      # directories must exist before `up` (the ops cron creates the first
      # as the unprivileged user; Docker would create it as root), see
      # docs/DEPLOY.md. Without a *.caddy in deploy/private, /private/ is 404.
      # The mountpoint web/private/ is tracked (.gitkeep): /srv is read-only,
      # so Docker cannot create it and the container would not start.
      - ./web-data/private:/srv/private:ro
      - ./deploy/private:/etc/caddy/private:ro
    networks:
      - web_proxy

  # One-shot data build: `docker compose run --rm pipeline`. Not started with
  # the stack, hence the profile.
  pipeline:
    build: .
    container_name: papamap-pipeline
    profiles: ["tools"]
    # The code default stays de,dk (config.DEFAULT_COUNTRIES) — this is the
    # deployment saying what *this* site sweeps, so a checkout and the test
    # suite keep their conservative default while papamap.de builds Europe.
    # Overridable per run: `docker compose run -e PAPAMAP_COUNTRIES=dk ...`.
    #
    # 46 countries = 73 sweep areas = about 145 Overpass queries a night since
    # the toilets-count rota of 2026-09-05 (73 sweeps + roughly a seventh of
    # the 73 counts + 62 leaderboard cities; it was 208 before, measured at
    # 80 min). The cron sits at 02:00 (docs/DEPLOY.md, and why not earlier):
    # the 05:30 ops mail must not read a half-written stats.json, and the
    # next wave chunks the US and Canada. de and fr are chunked (16 Länder, 13 régions); every other
    # country answers whole as one admin_level=2 area (pipeline/config.py
    # holds the per-country measurements, and why the US, Canada and Japan
    # are not on this list yet).
    environment:
      - PAPAMAP_COUNTRIES=de,dk,be,nl,at,ch,cz,pl,se,gb,fr,no,fi,is,ie,ee,lv,lt,lu,li,ad,mc,sm,mt,es,pt,it,gr,cy,si,sk,hu,hr,ro,bg,rs,ba,me,al,mk,xk,md,ua,by,au,nz
    volumes:
      - ./web-data:/out
    # Host network, not web_proxy. The job only makes outbound requests, and on
    # the host it has IPv6; Docker's bridge networks here are IPv4-only. On
    # 2026-08-23 overpass-api.de TCP-refused this host's IPv4 address on both
    # of its backends for hours while answering the very same host over IPv6,
    # and every query from this container died with "Network is unreachable"
    # although nothing was wrong with the queries.
    network_mode: host

networks:
  web_proxy:
    external: true
