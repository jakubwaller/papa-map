services:
  # Static server. The site is plain files, so they are bind-mounted rather
  # than baked in: `git pull` is the deploy, no rebuild.
  papamap:
    image: caddy:2-alpine
    container_name: papamap
    restart: unless-stopped
    # No host port: the only ingress is the host Caddy over web_proxy
    # (reverse_proxy papamap:8012).
    volumes:
      - ./deploy/papamap.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - ./web-data:/srv/data:ro   # generated GeoJSON + stats, read-only here
      # Also generated: one page per Bundesland. Same arrangement as /srv/data —
      # build output lives in web-data/ and is mounted back into the tree at the
      # URL it is served from, because web/ itself is read-only to the pipeline.
      - ./web-data/wickeltische:/srv/wickeltische:ro
      # The store app's offline city basemaps (pipeline/tiles.py, weekly):
      # 62 PMTiles files plus index.json, about 3 GB, served with CORS
      # headers (the Caddyfile) because the app fetches the catalogue from
      # its own origin. web/tiles/ is tracked (.gitkeep) for the same reason
      # as web/private/: /srv is read-only, the mountpoint must exist.
      - ./web-data/tiles:/srv/tiles:ro
      # The private ops page and the auth snippet that gates it. Both host
      # directories must exist before `up` (Docker would create them as
      # root; the ops service below writes as the host user), see
      # docs/DEPLOY.md. Without a *.caddy in deploy/private, /private/ is 404.
      # The mountpoint web/private/ is tracked (.gitkeep): /srv is read-only,
      # so Docker cannot create it and the container would not start.
      - ./web-data/private:/srv/private:ro
      - ./deploy/private:/etc/caddy/private:ro
    networks:
      - web_proxy

  # One-shot data build: `docker compose run --rm pipeline`. Not started with
  # the stack, hence the profile.
  pipeline:
    build: .
    container_name: papamap-pipeline
    profiles: ["tools"]
    # The code default stays de,dk (config.DEFAULT_COUNTRIES) — this is the
    # deployment saying what *this* site sweeps, so a checkout and the test
    # suite keep their conservative default while papamap.de builds Europe.
    # Overridable per run: `docker compose run -e PAPAMAP_COUNTRIES=dk ...`.
    #
    # 49 countries = 184 sweep areas = about 270 Overpass queries a night
    # (184 sweeps + roughly a seventh of the 184 toilets counts, on the rota
    # of 2026-09-05 + 62 leaderboard cities; the 46-country night was 208
    # before the rota, measured at 80 min). The cron sits at 02:00
    # (docs/DEPLOY.md, and why not earlier): the 05:30 ops mail must not
    # read a half-written stats.json. de, fr, us, ca and jp are chunked (16
    # Länder, 13 régions, 50 states + DC, 13 provinces and territories, 47
    # prefectures); every other country answers whole as one admin_level=2
    # area (pipeline/config.py holds the per-country measurements).
    environment:
      - PAPAMAP_COUNTRIES=de,dk,be,nl,at,ch,cz,pl,se,gb,fr,no,fi,is,ie,ee,lv,lt,lu,li,ad,mc,sm,mt,es,pt,it,gr,cy,si,sk,hu,hr,ro,bg,rs,ba,me,al,mk,xk,md,ua,by,au,nz,us,ca,jp
    volumes:
      - ./web-data:/out
    # Host network, not web_proxy. The job only makes outbound requests, and on
    # the host it has IPv6; Docker's bridge networks here are IPv4-only. On
    # 2026-08-23 overpass-api.de TCP-refused this host's IPv4 address on both
    # of its backends for hours while answering the very same host over IPv6,
    # and every query from this container died with "Network is unreachable"
    # although nothing was wrong with the queries.
    network_mode: host

  # The weekly city basemaps for the store app: `docker compose run --build
  # --rm tiles`, Sundays at 12:00 (docs/DEPLOY.md). Same image as the build
  # (it carries the pmtiles binary); writes web-data/tiles/*.pmtiles and
  # index.json, which the papamap service above serves at /tiles/. Host
  # network like the build: outbound only, and IPv6.
  tiles:
    build: .
    profiles: ["tools"]
    command: ["python", "-m", "pipeline.tiles", "--out", "/out/tiles"]
    user: "1000:1000"
    volumes:
      - ./web-data:/out
    network_mode: host

  # The daily ops check: `docker compose run --build --rm ops` at 05:30
  # (docs/DEPLOY.md). The same image as the build, so the host needs no
  # Python at all; `--build` on every run keeps the image at the checkout,
  # which keeps `git pull` the whole deploy for an ops change (a cached
  # rebuild is seconds). No container_name on purpose: `run` then gets a
  # unique generated name per run, so a build that overruns, a preview run
  # during the cron, or a container left behind by a reboot can never block
  # the next 05:30 with "name already in use".
  ops:
    build: .
    profiles: ["tools"]
    command: ["python", "-m", "pipeline.ops"]
    # ops.env holds the secrets and the mail settings — OSMCHA_TOKEN, CF_*,
    # PAPAMAP_SMTP_*, PAPAMAP_OPS_TO. Any path it sets belongs to the host
    # layout and is overridden below (`environment` beats `env_file`).
    # Optional so that a checkout without it can still `up` the site. This
    # long form needs Compose 2.24+ (the live server runs 5.x); an older
    # compose fails to parse the whole file, the site's `up` included.
    env_file:
      - path: ops.env
        required: false
    environment:
      - PAPAMAP_GEOJSON_PATH=/out/changing_tables.geojson
      - PAPAMAP_STATS_PATH=/out/stats.json
      - PAPAMAP_HISTORY_PATH=/out/history.json
      - PAPAMAP_OPS_HTML_PATH=/out/ops.html
      - PAPAMAP_OPS_PRIVATE_HTML_PATH=/out/private/ops.html
      - PAPAMAP_OPS_STATE_PATH=/ops-data/ops-state.json
      - PAPAMAP_BUILD_LOG_PATH=/logs/pipeline.log
    # The host user (uid 1000 on the live server), so the state and the two
    # pages it writes stay owned by whoever runs the cron and the one-off
    # commands, not by root.
    user: "1000:1000"
    volumes:
      # stats + geojson + history in; ops.html and private/ops.html out.
      - ./web-data:/out
      # The state, in a directory of its own rather than the repo root: the
      # check replaces the file atomically (write .tmp, rename), which is
      # impossible over a single bind-mounted file — and web-data/ is served,
      # so the state (visit history, per-feature statuses) must not go there.
      - ./ops-data:/ops-data
      # The build cron's log, for the "last build" section. A single-file
      # mount: `touch pipeline.log` before the first run (Docker would create
      # a directory of that name and the build cron's `>>` would fail), and
      # never rotate it by rename — the mount follows the inode.
      - ./pipeline.log:/logs/pipeline.log:ro
    # Like pipeline: outbound only (OSMCha, Cloudflare, SMTP), and IPv6.
    network_mode: host

networks:
  web_proxy:
    external: true
