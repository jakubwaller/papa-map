# The store app (app/), compiled where Xcode and the Android SDK exist: on
# GitHub's runners, not on a laptop. Unsigned builds only — they prove the
# Swift, the project file and the Gradle setup compile. Signing and the
# upload to App Store Connect / Play come later, with the account's keys as
# repository secrets. Public repo, so the macOS minutes are free.
name: App build

on:
  pull_request:
    paths:
      - "app/**"
      - "web/**"
      - ".github/workflows/app-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "web/**"
      - ".github/workflows/app-build.yml"
  workflow_dispatch:

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Build App and PapaMapWidget, unsigned
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath ios/DerivedData | tee ios/xcodebuild.log | grep -E "error:|warning: .*(deprecated|unavailable)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ios/xcodebuild.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: app/ios/xcodebuild.log
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
