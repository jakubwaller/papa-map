# The store app (app/), compiled where Xcode and the Android SDK exist: on
# GitHub's runners, not on a laptop. Public repo, so the macOS minutes are free.
#
# Every push to a PR gets the two unsigned builds — they prove the Swift, the
# project file and the Gradle setup compile. The signed ones are asked for:
#
#   testflight       archive, sign, upload to App Store Connect (TestFlight). A second job,
#                    beta-text (ubuntu-latest, needs: testflight — no Xcode, no reason to wait
#                    on Apple's processing on the Mac runner), then pushes
#                    app/ios/testflight/what-to-test.*.txt to that build and, if the repo
#                    variable ASC_BETA_GROUP is set, adds the build to that beta group
#   apple-setup      once per account: bundle ids, App Groups capability, the
#                    distribution certificate for app/ios/distribution.csr
#   beta-text-pull   print what TestFlight currently shows, no build needed
#   play             build the Android App Bundle, sign it with the upload key, keep it
#                    as an artifact and, if PLAY_SERVICE_ACCOUNT_JSON is set, send it to
#                    Google Play (track: repo variable PLAY_TRACK, default alpha = closed
#                    testing; status: PLAY_RELEASE_STATUS, default draft)
#
# Ask from the Actions tab (Run workflow → task) or by putting the label of
# that name on a pull request, which builds that PR's branch. The label route
# exists because a workflow can only be dispatched once its file is on main;
# secrets never reach a fork's PR, so a label on one signs nothing.
name: App build

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "app/**"
      - "web/**"
      - ".github/workflows/app-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "web/**"
      - ".github/workflows/app-build.yml"
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        default: build
        options: [build, testflight, apple-setup, beta-text-pull, play]

concurrency:
  group: app-build-${{ github.ref }}-${{ github.event.label.name || inputs.task || 'build' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # macos-26 for its Xcode 26: App Store Connect refuses an upload built with an
  # older SDK ("must be built with the iOS 26 SDK or later", 2026-09-18), and
  # the unsigned build uses the same image so it proves the same compiler.
  ios:
    if: github.event.action != 'labeled' && (inputs.task || 'build') == 'build'
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Build App and PapaMapWidget, unsigned
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath ios/DerivedData | tee ios/xcodebuild.log | grep -E "error:|warning: .*(deprecated|unavailable)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ios/xcodebuild.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: app/ios/xcodebuild.log
          retention-days: 7

  android:
    if: github.event.action != 'labeled' && (inputs.task || 'build') == 'build'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon

  # The Android counterpart of `testflight`. The bundle is always kept as an
  # artifact: Play takes an app's very first bundle only through the Console's
  # web page, and that is the file to drag in. The upload key signs it, Play App
  # Signing re-signs it with the key phones see (app/android/PLAY.md).
  play:
    if: inputs.task == 'play' || (github.event.action == 'labeled' && github.event.label.name == 'play')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Upload key
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          [ -n "$ANDROID_UPLOAD_KEYSTORE" ] || { echo "::error::secret ANDROID_UPLOAD_KEYSTORE is not set (app/android/PLAY.md)"; exit 1; }
          echo "$ANDROID_UPLOAD_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.p12"
      # The version code is the run number, as the iOS build number is: Play
      # refuses a code it has seen, and this one only goes up.
      - name: Signed App Bundle
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/upload.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: chmod +x android/gradlew && cd android && ./gradlew bundleRelease --no-daemon
      # Gradle signs a release it has a key for and leaves it unsigned
      # otherwise, silently; Play would then refuse it minutes later with a
      # vaguer message. jarsigner says so here.
      - name: Check the signature
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tee "$RUNNER_TEMP/verify.log"
          grep -q "jar verified" "$RUNNER_TEMP/verify.log"
          mkdir -p "$RUNNER_TEMP/out" && cp "$AAB" "$RUNNER_TEMP/out/papamap-${{ github.run_number }}.aab"
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: papamap-aab-${{ github.run_number }}
          path: ${{ runner.temp }}/out/*.aab
          retention-days: 30
      - name: Send to Google Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON not set: the bundle is only an artifact of this run."
            exit 0
          fi
          node android/play.mjs upload "$RUNNER_TEMP"/out/*.aab \
            --track "${{ vars.PLAY_TRACK || 'alpha' }}" --status "${{ vars.PLAY_RELEASE_STATUS || 'draft' }}"

  # Once per Apple account, and harmless to repeat: every step looks before it
  # makes. The certificate comes back as an artifact (public material, it is in
  # every .ipa); its private key never left the machine that wrote the CSR, and
  # the two meet again in the IOS_DIST_P12 secret.
  apple-setup:
    if: inputs.task == 'apple-setup' || (github.event.action == 'labeled' && github.event.label.name == 'apple-setup')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node ios/asc.mjs ids
      - run: node ios/asc.mjs cert ios/distribution.csr "$RUNNER_TEMP/distribution.cer"
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-certificate
          path: ${{ runner.temp }}/distribution.cer
          if-no-files-found: ignore
          retention-days: 7

  # Prints what is live in TestFlight right now — no build, no Xcode, just the
  # API — so the repo's testflight/what-to-test.*.txt can be compared against
  # App Store Connect without opening a browser.
  beta-text-pull:
    if: inputs.task == 'beta-text-pull'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node ios/asc.mjs beta-text pull

  testflight:
    if: inputs.task == 'testflight' || (github.event.action == 'labeled' && github.event.label.name == 'testflight')
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Distribution certificate into a throwaway keychain
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PW="$(uuidgen)"
          echo "$IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$PW" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/dist.p12"
      - name: Fresh App Store profiles
        run: |
          node ios/asc.mjs profiles "$RUNNER_TEMP/profiles"
          # Xcode 16 moved the directory; older tools still read the first one.
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP"/profiles/*.mobileprovision "$d/"
          done
      - name: API key where xcodebuild can read it
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      # The build number is the run number: App Store Connect refuses a number
      # it has seen, and this one only goes up.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/PapaMap.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -derivedDataPath ios/DerivedData | tee ios/xcodebuild.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          # No log artifact here, unlike the unsigned build: a signed log names
          # the team and the certificate, the job log masks them, a zip does not.
          grep -q "ARCHIVE SUCCEEDED" ios/xcodebuild.log || { tail -40 ios/xcodebuild.log; exit 1; }
      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>de.papamap.app</key><string>PapaMap CI de.papamap.app</string>
              <key>de.papamap.app.widget</key><string>PapaMap CI de.papamap.app.widget</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PapaMap.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tee ios/export.log
          grep -q "EXPORT SUCCEEDED" ios/export.log
      - name: Forget the keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/keys"

  # Split from `testflight` on purpose: pushing the text and distributing the
  # build can wait up to 25 minutes on Apple's own processing, and none of
  # that needs Xcode or a Mac. Keeping it on ubuntu-latest also means a
  # failure here shows up as its own red job instead of making the (already
  # successful) upload job look failed.
  beta-text:
    needs: testflight
    if: inputs.task == 'testflight' || (github.event.action == 'labeled' && github.event.label.name == 'testflight')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # github.run_number is the same for every job of one run, so this is
      # the same build number the testflight job just archived and uploaded.
      - name: Push TestFlight text
        run: node ios/asc.mjs beta-text push --build "${{ github.run_number }}"
      - name: Add build to the beta group
        if: vars.ASC_BETA_GROUP != ''
        env:
          ASC_BETA_GROUP: ${{ vars.ASC_BETA_GROUP }}
        run: node ios/asc.mjs beta-text distribute --build "${{ github.run_number }}" --group "$ASC_BETA_GROUP"
